version: "2"

run:
  timeout: 5m
  tests: true
  skip-dirs:
    - bin
    - vendor
    - deploy
    - migrations

linters:
  disable-all: false
  enable:
    - errcheck    
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - gosec

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true

  gosec:
    excludes:
      - G104
      - G107

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - errcheck

  max-issues-per-linter: 0
  max-same-issues: 0