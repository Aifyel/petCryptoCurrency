version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: petcrypto-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - crypto-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migration:
    image: migrate/migrate
    container_name: petcrypto_migration
    volumes:
      - ./deploy/migrations/postgres:/migrations
    command:
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      - up
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - crypto-net

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka_broker
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: "3nslNCuiQ2Gx9SntYsasOg"
      KAFKA_LOG4J_LOGGERS: "org.apache.kafka.image.loader.MetadataLoader=WARN"
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:29092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
    networks:
      - crypto-net

  fetcher-service:
    build:
      context: .
      dockerfile: ./internal/services/service_fetcher/Dockerfile
    container_name: fetcher_service
    env_file:
      - .env
    ports:
      - "50051:50051"
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
      kafka:
        condition: service_started
    networks:
      - crypto-net

  server-api:
    build:
      context: .
      dockerfile: ./internal/services/service_server_api/Dockerfile
    container_name: server_api_service
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      fetcher-service:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - crypto-net

  updater-service:
    build:
      context: .
      dockerfile: ./internal/services/service_updater/Dockerfile
    container_name: updater_service
    env_file:
      - .env
    depends_on:
      fetcher-service:
        condition: service_started
      kafka:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - crypto-net

volumes:
  postgres_data:

networks:
  crypto-net:
    driver: bridge